name: Kommo Lead Analysis

on:
  workflow_dispatch:
    inputs:
      probe_lead_id:
        description: "Diagnóstico: ID de um lead para inspecionar a API (deixe vazio para relatório normal)"
        required: false
        default: ""
  schedule:
    # Runs every day at 12:00 UTC. Adjust if you need another timezone.
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Kommo leads
    runs-on: ubuntu-latest

    env:
      KOMMO_SUBDOMAIN: ${{ secrets.KOMMO_SUBDOMAIN }}
      KOMMO_ACCESS_TOKEN: ${{ secrets.KOMMO_ACCESS_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate required secrets
        run: |
          if [ -z "$KOMMO_SUBDOMAIN" ]; then
            echo "Missing KOMMO_SUBDOMAIN secret" >&2
            exit 1
          fi
          if [ -z "$KOMMO_ACCESS_TOKEN" ]; then
            echo "Missing KOMMO_ACCESS_TOKEN secret" >&2
            exit 1
          fi

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Compute filter date (90 days ago)
        id: filter-date
        run: echo "date=$(date -d '90 days ago' '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Run API probe (diagnóstico)
        if: ${{ github.event.inputs.probe_lead_id != '' }}
        run: |
          python kommo_lead_analyzer.py \
            --from-api \
            --probe "${{ github.event.inputs.probe_lead_id }}"

      - name: Run Kommo analysis
        if: ${{ github.event.inputs.probe_lead_id == '' }}
        run: |
          python kommo_lead_analyzer.py \
            --from-api \
            --stale-hours 48 \
            --top-n 30 \
            --filter-from "${{ steps.filter-date.outputs.date }}" \
            --output kommo_analysis.md

      - name: Upload report artifact
        if: ${{ github.event.inputs.probe_lead_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kommo-analysis-report
          path: kommo_analysis.md
